spring:
  application:
    name: jobscan
  threads:
    virtual:
      enabled: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false 
        retry:
          enabled: true
          max-attempts: 3 
          initial-interval: 2000ms

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:fake_token}
    username: ${TELEGRAM_BOT_USERNAME:fake_bot}
    owner-chat-id: ${TELEGRAM_CHAT_ID:0}
    
user:
  profile:
    match-threshold: 75
    skills:
      - "Java"
      - "Spring Boot"
      - "Spring Security"
      - "Spring Data"
      - "Hibernate"
      - "PostgreSQL"
      - "Flyway"
      - "Redis"
      - "RabbitMQ"
      - "Docker"
      - "CI/CD"
      - "Git"
      - "GitHub"
      - "Linux"
      - "JWT"
      - "REST APIs"
      - "Maven"
      - "JUnit"
      - "SQL"
    title-stop-words:
      - "Senior"
      - "Lead"
      - "Architect"
      - "Principal"
    description-stop-words:
      - "Kotlin"
      - "PHP"
